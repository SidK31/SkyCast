<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SkyCast — fast, beautiful weather forecasts with hourly and 7-day weather data, weather insights and air quality.">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="SkyCast — Weather, beautifully simple">
  <meta property="og:description" content="Current weather, hourly trends, 7-day forecasts, weather insights and air quality.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SkyCast">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>SkyCast — Weather, beautifully simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" data-weather="clear">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="SkyCast home"><span class="brand-mark">☁</span>Sky<span>Cast</span></a>
      <div class="controls">
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">☾</button>
        <button id="unitToggle" class="icon-btn" aria-label="Toggle temperature unit">°C</button>
        <button id="locationBtn" class="location-btn" aria-label="Use my location">⌖ <span>My location</span></button>
      </div>
    </header>
    <section class="hero">
      <p class="eyebrow">WEATHER, BEAUTIFULLY SIMPLE</p>
      <h1>What's the sky<br><span>saying today?</span></h1>
      <p class="hero-copy">Get a clear forecast for wherever you are, in seconds.</p>
      <div class="search-wrap glass">
        <span class="search-icon">⌕</span>
        <input id="cityInput" type="search" autocomplete="off" placeholder="Search a city…" aria-label="City name">
        <button id="searchBtn">Search</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
    <section id="quickCities" class="quick-section" aria-label="Saved and recent cities"></section>
    <section id="result" aria-live="polite"></section>
    <footer>SkyCast • Weather data by Open-Meteo • Built for the web</footer>
  </main>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="enhance.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  </script>
</body>
</html>
